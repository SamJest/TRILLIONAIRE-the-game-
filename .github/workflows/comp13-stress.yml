name: COMP-1.3 300-Run Stress
on:
  push:
    branches: [balance/comp-1.3-candidate]
jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        offset: [0,30,60,90,120,150,180,210,240,270]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run preflight
      - name: Run 30 replay-verified victory-seeking policies
        env:
          OFFSET: ${{ matrix.offset }}
          COUNT: 30
        run: node scripts/comp13-competent-cohort.mjs
