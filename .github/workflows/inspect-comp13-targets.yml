name: Inspect COMP-1.3 Patch Targets
on:
  push:
    branches: [balance/comp-1.3-candidate]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run preflight
      - run: node scripts/inspect-comp13-targets.mjs
