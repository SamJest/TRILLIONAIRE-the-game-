name: COMP-1.3 Boundary QA
on:
  push:
    branches: [balance/comp-1.3-candidate]
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run preflight
      - run: node scripts/qa-comp13-boundaries.mjs
      - name: Run authoritative server QA
        run: |
          rm -rf data
          node server.mjs > /tmp/trillionaire-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; cat /tmp/trillionaire-server.log' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/health
          node qa-server.mjs
